name: Terraform Job

# A reusable Terraform plan/apply job, authenticating to Google Cloud through
# Workload Identity Federation.
#
# Plans on a pull request and comments the plan on it; applies on a push to the
# default branch. Every value that identifies a project, an identity or a
# provider is an INPUT -- this file describes the mechanism and knows nothing
# about the caller.
#
# `actions/checkout` inside a called workflow checks out the CALLER's
# repository, which is what lets one job serve many.
#
# Callers should pin this to a commit SHA rather than a branch. A mutable ref
# means a change here reaches every caller at once, with none of their CI
# having run against it; a pinned SHA makes adoption a reviewable pull request
# in each caller.
#
# Prerequisite, invisible from this file: in this repository, Settings ->
# Actions -> General -> Access must allow access from the repositories that
# call it. Without it every caller fails to resolve this workflow.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory holding the Terraform root to plan or apply.
        required: true
        type: string

      workload-identity-provider:
        description: >-
          Full resource name of the Workload Identity provider, as
          projects/NUMBER/locations/global/workloadIdentityPools/POOL/providers/PROVIDER.
        required: true
        type: string

      deploy-service-account:
        description: >-
          Service account to impersonate for an apply, and for a plan when no
          plan identity is supplied.
        required: true
        type: string

      plan-service-account:
        description: >-
          Optional read-only identity used for plans on a pull request. Supply
          it where the deploy identity cannot be impersonated from a pull
          request -- for example where its trust policy is pinned to the
          default branch -- or where a pull request should not hold write
          credentials. When set, the plan also runs with `-lock=false`, because
          a read-only identity cannot take a state lock.
        required: false
        type: string
        default: ""

      project-id:
        description: Google Cloud project id, used for logging and auth context.
        required: false
        type: string
        default: ""

      terraform-version:
        description: >-
          Terraform version to install. Set this explicitly to the version the
          caller already uses: the first apply under a newer binary rewrites
          the version recorded in state, after which the older binary refuses
          to read it. That is a one-way door, so adopting this workflow must
          not also be a Terraform upgrade -- take the upgrade separately.
        required: false
        type: string
        default: "1.15.8"

      label:
        description: Short name for this root, used as the plan comment heading.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      # The identity a run authenticates as, printed once. A plan identity is
      # used only on a pull request and only when supplied; printing both
      # candidates would read like a misconfiguration to anyone scanning the log.
      - name: Report resolved identity
        working-directory: .
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          PLAN_SA: ${{ inputs.plan-service-account }}
          DEPLOY_SA: ${{ inputs.deploy-service-account }}
        run: |
          set -eu
          echo "root:      ${{ inputs.label || inputs.working-directory }}"
          echo "project:   ${{ inputs.project-id || '(not supplied)' }}"
          echo "terraform: ${{ inputs.terraform-version }}"
          if [ "$IS_PR" = "true" ] && [ -n "$PLAN_SA" ]; then
            echo "identity:  $PLAN_SA  (read-only, pull request)"
          else
            echo "identity:  $DEPLOY_SA"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
          project_id: ${{ inputs.project-id }}
          # Plan identity on a pull request where one is supplied; the deploy
          # identity otherwise. Continuation lines are aligned with the first on
          # purpose: a >- folded scalar keeps newlines on more-indented lines.
          service_account: >-
            ${{ (github.event_name == 'pull_request' && inputs.plan-service-account)
            || inputs.deploy-service-account }}

      - name: Terraform Init
        run: terraform init -input=false

      # -lock=false only when planning as a supplied read-only identity, which
      # will not hold the object-write permission a state lock needs and would
      # fail with 403. A plan needs no lock; the apply still takes one.
      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        id: plan
        continue-on-error: true
        run: terraform plan -input=false -no-color ${{ inputs.plan-service-account && '-lock=false' || '' }}

      - name: Comment PR with plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_STDOUT: ${{ steps.plan.outputs.stdout }}
          LABEL: ${{ inputs.label || inputs.working-directory }}
        with:
          script: |
            // Plan text arrives via env, not via workflow-expression
            // interpolation into this script body. Terraform output is
            // untrusted text and interpolating it here is a script-injection
            // route. (Writing the interpolation syntax in this comment would
            // itself be parsed as an expression -- hence the prose.)
            const plan = process.env.PLAN_STDOUT || '(no output)';
            const body = [
              `#### Terraform Plan — \`${process.env.LABEL}\``,
              '',
              '```',
              plan.length > 60000 ? plan.slice(0, 60000) + '\n...truncated...' : plan,
              '```',
              '',
              `*Triggered by @${context.actor}*`,
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      # continue-on-error above keeps the comment step reachable on a failed
      # plan; this turns the failure back into a red check. Without it a plan
      # that could not run looks identical to a plan with no changes.
      - name: Fail on plan error
        if: github.event_name == 'pull_request' && steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: terraform apply -auto-approve -input=false
